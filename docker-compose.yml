services:
  db:
    image: postgres:18
    container_name: fit_tracker_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: fit_tracker
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: